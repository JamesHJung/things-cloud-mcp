name: Go

on:
  push:
  pull_request:

permissions:
  contents: read

# Supersede an in-flight run for the same ref rather than letting both finish.
# A rapid series of pushes otherwise runs CI to completion for every commit,
# including the ones already obsolete by the time a runner picks them up.
concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Track go.mod rather than a pinned version, which had drifted behind
          # it (1.23 against a go 1.24.0 module) and would have failed the
          # moment this workflow actually ran.
          go-version-file: go.mod

      - run: go build -v ./...

      - run: go vet ./...

      # One invocation, not three. A plain `go test` is fully subsumed by the
      # race build, and coverage is just an extra report on the same run.
      - name: Test (race detector, with coverage)
        run: go test -race -cover ./...

      # The commit a binary was built from is how a deployment is identified,
      # so a build that fails to record it is a real regression. `go test`
      # binaries carry no VCS stamp, only `go build` ones, which is why this
      # cannot be a unit test.
      - name: Binary reports its build
        run: |
          go build -o /tmp/things-server ./server/
          out="$(/tmp/things-server -version)"
          echo "reported: $out"
          case "$out" in
            unknown*) echo "::error::binary does not record the commit it was built from"; exit 1 ;;
          esac

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: golangci-lint
        # v7 is the first action release that accepts golangci-lint v2, which
        # is what .golangci.yml declares. The version is pinned so CI runs the
        # same linter as local development.
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15.0

  # Known-vulnerability scan. govulncheck reports only vulnerabilities the code
  # can actually reach, so a finding is a real call path, not a dependency that
  # merely exists. The toolchain is the latest patch of the Go minor the
  # Dockerfile builds with, not go.mod's version: go-version-file would install
  # exactly "1.25.5" and flag stdlib fixes that the shipped image already has.
  # Keep go-version-input in step with the Dockerfile's golang tag.
  #
  # govulncheck is installed by hand, pinned, rather than through
  # golang/govulncheck-action: the action installs @latest, and v1.8.0 onward
  # require a newer Go than this toolchain can install with. The pin only fixes
  # the scanner; the vulnerability database is fetched fresh on every run.
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          check-latest: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - run: govulncheck ./...

  # Things stores its date fields as date-only values at midnight UTC, so
  # anything classifying "today" has to reconcile a local calendar date with a
  # UTC-encoded one. That went wrong undetected because the suite only ever ran
  # at UTC, where the two coincide.
  #
  # The invariant itself is pinned by clock-injected tests with fixed zones, so
  # they hold whatever TZ the runner uses. This matrix is defence in depth for
  # the tests that do read the ambient clock, and so only needs one zone either
  # side of UTC: UTC itself is already covered by the build job above, and
  # fractional offsets are covered deterministically in sync/daybounds_test.go.
  timezones:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz:
          - America/Los_Angeles   # local date behind UTC each evening
          - Pacific/Kiritimati    # local date ahead of UTC each morning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test (TZ=${{ matrix.tz }})
        env:
          TZ: ${{ matrix.tz }}
        run: go test -count=1 ./...
