# Manual only. This fires on nothing automatically, deliberately.
#
# It was previously unreachable — the directory was .github/Workflows, which
# GitHub does not read — so it has never run. Enabling it on push would mean a
# deploy attempt on every commit to main, which fails without FLY_API_TOKEN and
# is wrong for any deployment that is not Fly.io (a container host, a NAS, a
# local process). Run it from the Actions tab when Fly.io is actually the
# target and the secret is set.
name: Deploy to Fly.io
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
